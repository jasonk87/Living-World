<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living World Sim - 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Living World Simulation</h1>
        <div id="game-status-header">
            <!-- Game status will be dynamically inserted here -->
        </div>
        <div id="election-status">
            <!-- Election status will be dynamically inserted here -->
        </div>
    </header>

    <div class="tabs">
        <button class="tab-button active" data-tab="world-tab">World</button>
        <button class="tab-button" data-tab="characters-tab">Characters</button>
        <button class="tab-button" data-tab="event-log-tab">Event Log</button>
    </div>

    <main class="tab-content-container">
        <!-- World Tab -->
        <div id="world-tab" class="tab-content active">
            <div class="world-container">
                <div id="game-map-area">
                    <div id="game-map">
                        <!-- Map cells will be generated by JavaScript -->
                    </div>
                </div>
                <div id="info-panel">
                    <h3>Details</h3>
                    <div id="entity-details">
                        <p>Click on an entity on the map for details.</p>
                    </div>
                </div>
            </div>
            <div id="controls-area">
                <h3>Controls</h3>
                <div id="controls">
                    <button id="pause-button">Pause</button>
                    <span>Speed:</span>
                    <button class="speed-button" data-speed="0.5">0.5x</button>
                    <button class="speed-button" data-speed="1">1x</button>
                    <button class="speed-button" data-speed="2">2x</button>
                    <button class="speed-button" data-speed="5">5x</button>
                </div>
            </div>
        </div>

        <!-- Characters Tab -->
        <div id="characters-tab" class.="tab-content">
            <h2>Characters</h2>
            <div class="character-list-container">
                <div id="character-list">
                    <!-- Character list will be populated by JS -->
                </div>
                <div id="character-details-panel">
                    <p>Select a character to see their details.</p>
                </div>
            </div>
        </div>

        <!-- Event Log Tab -->
        <div id="event-log-tab" class="tab-content">
            <h2>Full Event Log</h2>
            <div id="event-log">
                <!-- Event log messages will be generated by JavaScript -->
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
