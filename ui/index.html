<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living World Sim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="game-map-area">
            <h2>Game Map</h2>
            <div id="game-map">
                <!-- Map cells will be generated by JavaScript -->
            </div>
        </div>
        <div id="info-panel">
            <h2>Info / Controls</h2>
            <div id="game-status">
                <!-- Game status like day, time, season will be shown here -->
            </div>
            <div id="controls">
                <button id="pause-button">Pause</button>
                <button id="toggle-details-button">Toggle Entity Details (Off)</button>
                <hr>
                <span>Speed:</span>
                <button class="speed-button" data-speed="0.5">0.5x</button>
                <button class="speed-button" data-speed="1">1x</button>
                <button class="speed-button" data-speed="2">2x</button>
                <button class="speed-button" data-speed="5">5x</button>
            </div>
            <div id="entity-details">
                <p>Click on a character/building on the map for details.</p>
                {/* Entity details will be shown here. Structure will be:
                    <dl>
                        <dt>Name</dt><dd id="char-detail-name"></dd>
                        ... other general details ...
                    </dl>
                    <div id="character-social-info">
                        <h3>Social Info</h3>
                        <div id="char-known-chars"><h4>Known Characters:</h4><ul></ul></div>
                        <div id="char-relationships"><h4>Relationships:</h4><ul></ul></div>
                        <div id="char-dialogue-history"><h4>Recent Dialogue:</h4><ul></ul></div>
                    </div>
                */}
            </div>
        </div>
    </div>
    <div id="event-log-area">
        <h2>Event Log</h2>
        <div id="event-log">
            <!-- Event log messages will be generated by JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
