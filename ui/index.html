<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living World Sim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="game-map-area">
            <h2>Game Map</h2>
            <div id="game-map">
                <!-- Map cells will be generated by JavaScript -->
            </div>
        </div>
        <div id="info-panel">
            <h2>Info / Controls</h2>
            <div id="game-status">
                <!-- Game status like day, time, season will be shown here -->
            </div>
            <div id="controls">
                <button id="pause-button">Pause</button>
                <button id="toggle-details-button">Toggle Entity Details (Off)</button>
            </div>
            <div id="entity-details">
                <p>Click on a character/building on the map for details.</p>
                {/* Entity details will be shown here */}
            </div>
        </div>
    </div>
    <div id="event-log-area">
        <h2>Event Log</h2>
        <div id="event-log">
            <!-- Event log messages will be generated by JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
